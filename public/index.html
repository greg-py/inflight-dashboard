<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inflight</title>
<script>
  // Basecoat's theme: a stored choice wins, otherwise follow the system. Runs
  // before the stylesheet so the page never flashes the wrong theme.
  (() => {
    try {
      const stored = localStorage.getItem("themeMode");
      if (stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    } catch (_) {}
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.1.0/dist/basecoat.cdn.min.css"
  integrity="sha384-pGk605ml41MkC5v6mwKQprSH7YgU5ZhqFrTH+liRoLfHsuOg7bGreN2+Dcb63/Ur" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/basecoat-css@1.1.0/dist/js/all.min.js"
  integrity="sha384-5JGrgulX7bsJhcDzfGzGuSucYtpTu2CbgV4zYQaKB72zRNGABsHs2yeadK+XxOne" crossorigin="anonymous"></script>
<style>
  /* Layout and a few text treatments only; every component is Basecoat's,
     and every color is a Basecoat token, so dark mode comes for free. */
  body { background: var(--background); color: var(--foreground); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 20px; }
  @media (min-width: 700px) { .wrap { padding: 28px 24px 56px; } }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 600; margin-right: auto; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .cols { display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: flex-start; }
  .col { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .heading { display: flex; align-items: center; gap: 8px; margin: 0; padding-bottom: 8px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); }
  .sub { margin: 14px 0 0; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .mono, .key, .age { font-family: var(--font-mono, ui-monospace, monospace); }
  .key { font-size: 12px; color: var(--muted-foreground); margin-right: 6px; }
  .age { font-size: 12px; color: var(--muted-foreground); min-width: 36px; text-align: right; }
  .item-group, .item { min-width: 0; }
  .item { flex-wrap: nowrap; }
  .item > section { flex: 1 1 0; min-width: 0; }
  .item h3, .item p { display: block; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #left .item p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item aside { flex: none; display: flex; align-items: center; gap: 8px; }
  .facts { color: var(--muted-foreground); font-weight: 400; }
  .bad { color: var(--destructive); }
  .theme-light { display: none; }
  .dark .theme-light { display: inline; }
  .dark .theme-dark { display: none; }
  .accordion summary { font-size: 13px; }
  @media (max-width: 520px) { .item aside .badge { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Inflight</h1>
    <div class="meta" id="meta"></div>
    <button class="btn" data-variant="ghost" data-size="icon" id="theme" type="button" aria-label="Toggle dark mode">
      <svg class="theme-dark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="theme-light" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="btn" data-variant="outline" data-size="icon" id="refresh" type="button" aria-label="Refresh now">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    </button>
  </header>
  <div id="errors"></div>
  <div class="cols">
    <section class="col" id="left" aria-label="Your move"></section>
    <section class="col" id="right" aria-label="Waiting on others"></section>
  </div>
</div>
<div id="toaster" class="toaster"></div>
<script>
// Waiting rows group under these headings, closest to shipping first.
const STATUS_ORDER = ["READY TO MERGE", "In Testing", "Ready To Test", "In Code Review", "In Design Review", "In Progress", "TO DO"];
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const open = new Set(JSON.parse(store.get("inflight.open", "[]")));
let data = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const age = (ms) => ms == null ? "" : ms < 3.6e6 ? `${Math.max(1, Math.round(ms / 6e4))}m` : ms < 8.64e7 ? `${Math.round(ms / 3.6e6)}h` : `${Math.round(ms / 8.64e7)}d`;
const ext = (href, inner, cls = "") => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
const badge = (text, variant = "secondary") => `<span class="badge" data-variant="${variant}">${esc(text)}</span>`;

// Everything worth knowing about a row, as one muted run of text.
const facts = (r) => {
  const bits = [];
  for (const p of r.prs) {
    const repo = p.repo && !p.repo.endsWith("/PerformYard") ? p.repo.split("/")[1] : "";
    bits.push(ext(p.url, `${esc(repo)}#${p.number}`));
    for (const c of p.chips) bits.push(`<span class="${c.tone === "bad" ? "bad" : ""}">${esc(c.text)}</span>`);
  }
  for (const c of r.chips) bits.push(`<span class="${c.tone === "bad" ? "bad" : ""}">${esc(c.text)}</span>`);
  return bits.join(" · ");
};

// The next step: a skill command to copy, or the page where the step happens.
const actionButton = (n) => {
  if (n.skill) {
    const cmd = `/${n.skill}${n.arg ? " " + n.arg : ""}`;
    return `<button class="btn mono" data-variant="outline" data-size="sm" type="button" data-copy="${esc(cmd)}" title="Copy ${esc(cmd)}">/${esc(n.skill)}</button>`;
  }
  const where = n.href.includes("github.com") ? "GitHub" : n.href.includes("atlassian.net") ? "Jira" : "Open";
  return ext(n.href, `${where} ↗`, "btn").replace('class="btn"', 'class="btn" data-variant="outline" data-size="sm"');
};

const actionItem = (r) => {
  const f = facts(r);
  return `<article class="item" data-size="sm" role="listitem">
    <section>
      <h3>${esc(r.next.label)}</h3>
      <p>${ext(r.url, esc(r.key), "key")}${esc(r.title)}${f ? ` <span class="facts">· ${f}</span>` : ""}</p>
    </section>
    <aside><span class="age">${age(r.ageMs)}</span>${actionButton(r.next)}</aside>
  </article>`;
};

const waitingItem = (r) => {
  const f = facts(r);
  return `<article class="item" data-size="xs" role="listitem">
    <section><h3>${ext(r.url, esc(r.key), "key")}${esc(r.title)}${f ? ` <span class="facts">· ${f}</span>` : ""}</h3></section>
    <aside>${r.ball ? badge(r.ball) : ""}<span class="age">${age(r.ageMs)}</span></aside>
  </article>`;
};

const list = (items) => `<div class="item-group" role="list">${items.join("")}</div>`;

const fold = (id, label, items) => items.length === 0 ? "" : `
  <details data-fold="${id}" ${open.has(id) ? "open" : ""}>
    <summary>${esc(label)} ${badge(String(items.length))}</summary>
    <section>${list(items)}</section>
  </details>`;

const groupOf = (r) => r.group === "pod" ? "Pod" : r.group === "loose" ? "Other PRs" : r.status || "Other";
const rank = (g) => { const i = STATUS_ORDER.findIndex((s) => s.toLowerCase() === g.toLowerCase()); return i === -1 ? 50 : i; };

const render = () => {
  const rows = data.rows;
  const parked = (r) => r.group === "shelf" || r.group === "later";
  const mine = rows.filter((r) => r.yours && r.next && !parked(r));
  const waiting = rows.filter((r) => !parked(r) && !mine.includes(r));
  const ctx = data.context && !data.context.error ? data.context : null;
  const rel = data.release;

  let left = `<h2 class="heading">Your move ${badge(String(mine.length), "primary")}</h2>${list(mine.map(actionItem))}`;
  if (ctx?.owed?.length) {
    left += `<h3 class="sub">Owed · Slack and meetings</h3>` + list(ctx.owed.map((o) => `<article class="item" data-size="sm" role="listitem">
      <section><h3>${esc(o.what)}</h3><p>${o.url ? ext(o.url, esc(o.who)) : esc(o.who)}</p></section>
      <aside><span class="age">${o.since ? age(Date.now() - new Date(o.since)) : ""}</span></aside></article>`));
  }
  document.getElementById("left").innerHTML = left;

  let right = "";
  if (ctx?.calendar?.length) {
    right += `<h2 class="heading">Calendar</h2>` + list(ctx.calendar.map((e) => `<article class="item" data-size="xs" role="listitem">
      <section><h3><span class="key">${esc(new Date(e.start).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }))}</span>${esc(e.title)}</h3></section>
      <aside>${e.prep ? `<button class="btn mono" data-variant="outline" data-size="sm" type="button" data-copy="/${esc(e.prep)}">/${esc(e.prep)}</button>` : ""}</aside></article>`)) + `<div style="height:16px"></div>`;
  }
  const groups = new Map();
  for (const r of waiting) {
    const g = groupOf(r);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(r);
  }
  right += `<h2 class="heading">Waiting on others ${badge(String(waiting.length))}</h2>`;
  for (const [g, rs] of [...groups].sort((a, b) => rank(a[0]) - rank(b[0]))) {
    right += `<h3 class="sub">${esc(g)}</h3>${list(rs.map(waitingItem))}`;
  }
  const unreleased = (rel?.unreleased ?? []).map((u) => `<article class="item" data-size="xs" role="listitem">
    <section><h3>${u.number ? ext(u.url, `#${u.number}`, "key") : ""}${esc(u.title)}</h3></section>
    <aside>${badge(u.author)}<span class="age">${age(Date.now() - new Date(u.mergedAt))}</span></aside></article>`);
  const folds = [
    fold("unreleased", `Unreleased since ${rel?.tag ?? ""}`, unreleased),
    fold("shelf", "Shelf", rows.filter((r) => r.group === "shelf").map(waitingItem)),
    fold("later", "Later", rows.filter((r) => r.group === "later").map(waitingItem)),
  ].join("");
  if (folds.trim()) right += `<section class="accordion" data-multiple style="margin-top:16px">${folds}</section>`;
  document.getElementById("right").innerHTML = right;

  const meta = [];
  if (rel) meta.push(badge(`${rel.tag} · ${rel.aheadBy ? `master +${rel.aheadBy}` : "master even"}`, "outline"));
  if (rel?.inFlight) meta.push(badge(`${rel.inFlight.version} next: ${rel.inFlight.nextGate ?? rel.inFlight.status}`, "outline"));
  if (data.sprint) meta.push(badge(`${data.sprint.name} · ${data.sprint.done}/${data.sprint.total} pts`, "outline"));
  meta.push(`<span class="age" title="Last refreshed">${age(Date.now() - new Date(data.fetchedAt))}</span>`);
  document.getElementById("meta").innerHTML = meta.join("");
};

const toast = (title, description) => {
  const toaster = document.getElementById("toaster");
  if (typeof toaster.toast === "function") toaster.toast({ category: "success", title, description, duration: 1800 });
};

document.addEventListener("click", async (e) => {
  const c = e.target.closest("[data-copy]");
  if (!c) return;
  try { await navigator.clipboard.writeText(c.dataset.copy); toast("Copied", c.dataset.copy); }
  catch { toast("Copy this", c.dataset.copy); }
});
// Remember which folds are open across refreshes.
document.addEventListener("toggle", (e) => {
  const id = e.target.dataset?.fold;
  if (!id) return;
  e.target.open ? open.add(id) : open.delete(id);
  store.set("inflight.open", JSON.stringify([...open]));
}, true);

document.getElementById("theme").addEventListener("click", () => {
  if (window.basecoat?.theme) return window.basecoat.theme.toggle();
  const dark = document.documentElement.classList.toggle("dark");
  store.set("themeMode", dark ? "dark" : "light");
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (store.get("themeMode", null) === null) document.documentElement.classList.toggle("dark", e.matches);
});

const load = async (fresh = false) => {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  try {
    const res = await fetch(`/api/board${fresh ? "?fresh" : ""}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error);
    data = body;
    const errs = (data.errors ?? []).concat(data.context?.error ? [data.context.error] : []);
    document.getElementById("errors").innerHTML = errs.map((m) => `<div class="alert" data-variant="destructive"><h2>${esc(m)}</h2></div>`).join("");
    render();
  } catch (err) {
    document.getElementById("errors").innerHTML = `<div class="alert" data-variant="destructive"><h2>${esc(err.message)}</h2></div>`;
  } finally {
    btn.disabled = false;
  }
};
document.getElementById("refresh").addEventListener("click", () => load(true));
setInterval(() => { if (!document.hidden) load(); }, 120_000);
setInterval(() => { if (data) render(); }, 30_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && data && Date.now() - new Date(data.fetchedAt) > 120_000) load(); });
load();
</script>
</body>
</html>
