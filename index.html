<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In-flight</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛫</text></svg>" />
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e3e3df;
    --text: #1a1a18;
    --text-2: #6b6b66;
    --text-3: #9c9c96;
    --red: #a32d2d;
    --red-bg: #fcebeb;
    --amber: #854f0b;
    --amber-bg: #faeeda;
    --green: #3b6d11;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --purple: #534ab7;
    --gray-chip-bg: #f1efe8;
    --gray-chip: #444441;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #262624;
      --border: #3a3a37;
      --text: #ececea;
      --text-2: #a8a8a2;
      --text-3: #77776f;
      --red: #f09595;
      --red-bg: #46201f;
      --amber: #fac775;
      --amber-bg: #3d2c12;
      --green: #97c459;
      --blue: #85b7eb;
      --blue-bg: #16324c;
      --purple: #afa9ec;
      --gray-chip-bg: #37372f;
      --gray-chip: #d3d1c7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  }
  main { max-width: 1360px; margin: 0 auto; padding: 20px 20px 48px; }
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 4px 4px 14px;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; }
  #refreshed { font-size: 12px; color: var(--text-3); }
  #agent-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #agent-controls .agent-name { font-size: 11.5px; color: var(--text-3); margin-left: 10px; }
  #agent-controls select {
    font-size: 11.5px; color: var(--text-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; max-width: 170px;
  }
  .banner {
    margin: 0 0 12px; padding: 8px 12px; border-radius: 8px;
    background: var(--amber-bg); color: var(--amber); font-size: 12.5px;
  }
  #error { margin: 0 0 12px; color: var(--red); font-size: 13px; }
  .grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px; align-items: start;
  }
  @media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .section-head {
    padding: 12px 18px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  }
  .section-head.needs_you { color: var(--red); }
  .section-head.waiting { color: var(--amber); }
  .section-head.no_pr { color: var(--text-3); }
  .section-head.reviews { color: var(--purple); }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 18px; border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; }
  .section-head + .row { border-top: none; }
  .key { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; min-width: 72px; padding-top: 1px; color: var(--text-2); }
  .key a { color: var(--text-2); text-decoration: none; }
  .key a:hover { text-decoration: underline; }
  .body { flex: 1; min-width: 0; }
  .summary { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subtask-of { color: var(--text-3); font-size: 12px; }
  .pr-line { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .pr-line a { font-family: ui-monospace, "SF Mono", monospace; color: var(--blue); text-decoration: none; }
  .pr-line a:hover { text-decoration: underline; }
  .r-bad { color: var(--red); }
  .r-good { color: var(--green); }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; margin-top: 1px;
    background: var(--gray-chip-bg); color: var(--gray-chip);
  }
  .chip.indeterminate { background: var(--blue-bg); color: var(--blue); }
  .empty { padding: 4px 18px 12px; font-size: 12.5px; color: var(--text-3); }
  .act {
    visibility: hidden; border: none; background: none; cursor: pointer;
    font-size: 11px; color: var(--text-3); padding: 2px 4px; margin-top: 1px;
  }
  .act:hover { color: var(--text); text-decoration: underline; }
  .row:hover .act { visibility: visible; }
  .launch { visibility: hidden; white-space: nowrap; }
  .row:hover .launch { visibility: visible; }
  .launch .lb {
    border: none; background: none; cursor: pointer; font: inherit;
    font-size: 11.5px; color: var(--blue); padding: 0 2px;
  }
  .launch .lb:hover { text-decoration: underline; }
  .launch .lb:disabled { color: var(--text-3); cursor: default; text-decoration: none; }
  #hidden-card[hidden] { display: none; }
  #hidden-details summary {
    padding: 12px 18px; font-size: 12px; font-weight: 600; color: var(--text-3);
    cursor: pointer; list-style-position: inside;
  }
  #hidden-details .row { opacity: 0.6; }
  #hidden-details .row:hover { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>In-flight</h1>
    <span id="agent-controls"></span>
    <span id="refreshed">loading…</span>
  </div>
  <div id="banners"></div>
  <div id="error" hidden></div>
  <div class="grid">
    <div class="col">
      <div class="card" id="section-needs_you"></div>
      <div class="card" id="section-waiting"></div>
      <div class="card" id="section-no_pr"></div>
    </div>
    <div class="col">
      <div class="card" id="section-reviews"></div>
      <div class="card" id="hidden-card" hidden>
        <details id="hidden-details">
          <summary id="hidden-summary">Hidden</summary>
          <div id="hidden-list"></div>
        </details>
      </div>
    </div>
  </div>
</main>
<script>
  const REFRESH_MS = 120_000;
  const SECTIONS = [
    { id: "needs_you", label: "Needs you" },
    { id: "waiting", label: "Waiting on others" },
    { id: "no_pr", label: "In development" },
  ];
  const BAD_REASONS = ["changes requested", "CI failing", "conflicts with base"];
  const GOOD_REASONS = [
    "CI green",
    "approved · ready to merge",
    "approved · awaiting QA",
    "approved · move to QA",
    "approved",
  ];

  let lastFetched = null;
  let lastData = null;

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );

  const reasonSpan = (reason) => {
    const cls = BAD_REASONS.includes(reason) ? "r-bad" : GOOD_REASONS.includes(reason) ? "r-good" : "";
    return `<span class="${cls}">${esc(reason)}</span>`;
  };

  const actButton = (action, id) =>
    `<button class="act" data-action="${action}" data-id="${esc(id)}">${action}</button>`;

  const launchControls = (launch, id, prNumber) => {
    if (!launch) return "";
    const prAttr = prNumber != null ? ` data-pr="${prNumber}"` : "";
    const agentButton = (agent) =>
      `<button class="lb" data-agent="${agent}" data-id="${esc(id)}"${prAttr}>${agent}</button>`;
    return `<span class="launch" title="${esc(launch.prompt)}"> · ${esc(launch.label)} →
      ${agentButton("claude")}${agentButton("codex")}<button class="lb" data-copy="${esc(
        launch.prompt,
      )}">copy</button></span>`;
  };

  const prLine = (pr, itemId) =>
    `<div class="pr-line"><a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(
      pr.repo,
    )}#${pr.number}</a> · ${pr.reasons.map(reasonSpan).join(" · ")}${launchControls(
      pr.launch,
      itemId,
      pr.number,
    )}</div>`;

  const workRowHtml = (item, action) => {
    const key = item.key
      ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.key)}</a>`
      : "—";
    const subtask =
      item.isSubtask && item.parentKey
        ? ` <span class="subtask-of">· subtask of ${esc(item.parentKey)}</span>`
        : "";
    const prLines = item.prs.map((pr) => prLine(pr, item.id)).join("");
    const parentPrLinks = (item.parentPrs ?? [])
      .map((pr) => `<a href="${esc(pr.url)}" target="_blank" rel="noopener">#${pr.number}</a>`)
      .join(", ");
    const noPr =
      item.key && item.prs.length === 0
        ? `<div class="pr-line">${
            parentPrLinks
              ? `on parent ${esc(item.parentKey)} · ${parentPrLinks}`
              : "no open PR"
          }${launchControls(item.launch, item.id)}</div>`
        : "";
    return `<div class="row">
      <span class="key">${key}</span>
      <div class="body"><div class="summary" title="${esc(item.summary)}">${esc(
        item.summary,
      )}${subtask}</div>${prLines}${noPr}</div>
      <span class="chip ${esc(item.statusCategory)}">${esc(item.status)}</span>
      ${actButton(action, item.id)}
    </div>`;
  };

  const reviewRowHtml = (pr, action) => {
    const ciSpan =
      pr.ci === "failure" ? reasonSpan("CI failing") : pr.ci === "success" ? reasonSpan("CI green") : "";
    const details = [
      `<a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.repo)}#${pr.number}</a>`,
      `open ${pr.ageDays}d`,
      pr.viewerReviewState ? "re-requested" : "",
      pr.isDraft ? "draft" : "",
      ciSpan,
    ].filter(Boolean);
    return `<div class="row">
      <span class="key">${esc(pr.author)}</span>
      <div class="body"><div class="summary" title="${esc(pr.title)}">${esc(pr.title)}</div>
        <div class="pr-line">${details.join(" · ")}${launchControls(pr.launch, pr.id)}</div></div>
      <span class="chip">${esc(pr.repo.split("/")[1] ?? pr.repo)}</span>
      ${actButton(action, pr.id)}
    </div>`;
  };

  const sectionHtml = (cls, label, rows) =>
    `<div class="section-head ${cls}">${label} · ${rows.length}</div>` +
    (rows.length ? rows.join("") : `<div class="empty">nothing here</div>`);

  let controlsBuilt = false;
  const buildAgentControls = (agentOptions) => {
    if (controlsBuilt || !agentOptions) return;
    controlsBuilt = true;
    const select = (id, values, defaultLabel, title) => {
      const options = [`<option value="">${esc(defaultLabel)}</option>`]
        .concat(values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`))
        .join("");
      return `<select id="${id}" title="${esc(title)}">${options}</select>`;
    };
    document.getElementById("agent-controls").innerHTML = Object.entries(agentOptions)
      .map(([agent, opts]) => {
        const modelLabel = opts.defaultModel ? `default (${opts.defaultModel})` : "default model";
        const effortLabel = opts.defaultEffort
          ? `default (${opts.defaultEffort})`
          : "default effort";
        return (
          `<span class="agent-name">${esc(agent)}</span>` +
          select(`${agent}-model`, opts.models, modelLabel, `${agent} model for launched sessions`) +
          select(`${agent}-effort`, opts.efforts, effortLabel, `${agent} effort for launched sessions`)
        );
      })
      .join("");
  };

  const agentSelection = (agent) => ({
    model: document.getElementById(`${agent}-model`)?.value ?? "",
    effort: document.getElementById(`${agent}-effort`)?.value ?? "",
  });

  const render = (data) => {
    buildAgentControls(data.agentOptions);
    const banners = [];
    for (const [name, source] of Object.entries(data.sources)) {
      if (!source.ok) banners.push(`<div class="banner">${esc(name)}: ${esc(source.error)}</div>`);
    }
    document.getElementById("banners").innerHTML = banners.join("");

    for (const section of SECTIONS) {
      const items = data.items.filter((item) => item.section === section.id && !item.hidden);
      document.getElementById(`section-${section.id}`).innerHTML = sectionHtml(
        section.id,
        section.label,
        items.map((item) => workRowHtml(item, "hide")),
      );
    }

    const reviews = data.reviewRequests.filter((pr) => !pr.hidden);
    document.getElementById("section-reviews").innerHTML = sectionHtml(
      "reviews",
      "Reviews requested of you",
      reviews.map((pr) => reviewRowHtml(pr, "hide")),
    );

    const hiddenWork = data.items.filter((item) => item.hidden);
    const hiddenReviews = data.reviewRequests.filter((pr) => pr.hidden);
    const hiddenCount = hiddenWork.length + hiddenReviews.length;
    document.getElementById("hidden-card").hidden = hiddenCount === 0;
    document.getElementById("hidden-summary").textContent = `Hidden · ${hiddenCount}`;
    document.getElementById("hidden-list").innerHTML =
      hiddenWork.map((item) => workRowHtml(item, "restore")).join("") +
      hiddenReviews.map((pr) => reviewRowHtml(pr, "restore")).join("");
  };

  const showRefreshed = () => {
    if (!lastFetched) return;
    const mins = Math.round((Date.now() - lastFetched) / 60_000);
    document.getElementById("refreshed").textContent =
      mins < 1 ? "refreshed just now" : `refreshed ${mins} min ago`;
  };

  const refresh = async () => {
    const errorEl = document.getElementById("error");
    try {
      const res = await fetch("/api/data");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      lastData = await res.json();
      render(lastData);
      lastFetched = Date.now();
      errorEl.hidden = true;
    } catch (err) {
      errorEl.textContent = `Refresh failed: ${err.message}`;
      errorEl.hidden = false;
    }
    showRefreshed();
  };

  const flash = (button, text) => {
    const original = button.textContent;
    button.textContent = text;
    button.disabled = true;
    setTimeout(() => {
      button.textContent = original;
      button.disabled = false;
    }, 1500);
  };

  const copyText = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
  };

  document.querySelector("main").addEventListener("click", async (event) => {
    const launchButton = event.target.closest("button.lb");
    if (launchButton) {
      const { agent, id, pr, copy } = launchButton.dataset;
      if (copy !== undefined) {
        await copyText(copy);
        flash(launchButton, "copied");
        return;
      }
      try {
        const res = await fetch("/api/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, prNumber: pr ? Number(pr) : null, agent, ...agentSelection(agent) }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        flash(launchButton, "launched ✓");
      } catch (err) {
        const errorEl = document.getElementById("error");
        errorEl.textContent = `launch failed: ${err.message}`;
        errorEl.hidden = false;
      }
      return;
    }
    const button = event.target.closest("button.act");
    if (!button) return;
    const { action, id } = button.dataset;
    button.disabled = true;
    try {
      const res = await fetch(`/api/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (lastData) {
        for (const entry of [...lastData.items, ...lastData.reviewRequests]) {
          if (entry.id === id) entry.hidden = action === "hide";
        }
        render(lastData);
      }
    } catch (err) {
      button.disabled = false;
      const errorEl = document.getElementById("error");
      errorEl.textContent = `${action} failed: ${err.message}`;
      errorEl.hidden = false;
    }
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(showRefreshed, 15_000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && lastFetched && Date.now() - lastFetched > 30_000) {
      refresh();
    }
  });
</script>
</body>
</html>
